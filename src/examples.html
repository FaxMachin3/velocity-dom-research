<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Velocity component examples</title><style>body{font:16px system-ui;margin:28px;color:#18304b}button{padding:10px;margin-right:8px}label{display:block;margin:8px}input{margin-left:10px;padding:6px}section{border:1px solid #c8d4e3;margin:10px;padding:12px}output{display:block;padding:8px}</style><h1>Velocity v0.4 examples</h1><p>Editable form and nested tree built with the public template API.</p><button id="form">Editable form</button><button id="tree">Nested tree</button><button id="reverse">Reverse entries</button><div id="host"></div><script type="module">
import {Form,Tree} from '/examples.js';let app,state,mode;const host=document.querySelector('#host');function showForm(){app?.destroy();mode='form';state={fields:Array.from({length:50},(_,i)=>({id:'field-'+i,label:'Field '+i,value:'',change:value=>{state={...state,fields:state.fields.map(f=>f.id==='field-'+i?{...f,value}:f),message:'Edited Field '+i};app.update(state);}})),message:'Type in a field, then reverse entries to check retained state.'};app=Form(state);host.append(...app.nodes);}function showTree(){app?.destroy();mode='tree';state={groups:Array.from({length:8},(_,i)=>({id:'group-'+i,name:'Group '+i,children:Array.from({length:5},(_,j)=>({id:j,value:'Leaf '+j}))}))};app=Tree(state);host.append(...app.nodes);}document.querySelector('#form').onclick=showForm;document.querySelector('#tree').onclick=showTree;document.querySelector('#reverse').onclick=()=>{state=mode==='form'?{...state,fields:state.fields.slice().reverse()}:{...state,groups:state.groups.slice().reverse()};app.update(state);};showForm();
</script></html>
